<article class="transactions bb-card">
  <header class="bb-card__head">
    <div>
      <h3 class="bb-card__title">Transações recentes</h3>
      <p class="bb-card__subtitle">Últimos lançamentos</p>
    </div>
    <a class="bb-card__link" routerLink="/transactions">Ver todas</a>
  </header>

  <ul class="transactions__list">
    @for (item of items(); track item.description) {
      <li class="transactions__row">
        <span
          class="transactions__icon"
          [class.transactions__icon--income]="item.kind === 'INCOME'"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
        </span>
        <div class="transactions__info">
          <span class="transactions__name">{{ item.description }}</span>
          <span class="transactions__meta"
            >{{ item.date | date: 'dd/MM/yyyy' }} · {{ item.category }}</span
          >
        </div>
        <span
          class="transactions__amount bb-amount"
          [class.transactions__amount--income]="item.kind === 'INCOME'"
        >
          {{ item.kind === 'INCOME' ? '+' : '−' }} {{ item.amount | currency }}
        </span>
      </li>
    }
  </ul>
</article>
