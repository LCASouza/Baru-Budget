<section class="settings">
  <nav mat-tab-nav-bar [tabPanel]="panel" class="settings__tabs" aria-label="Seções de configurações">
    @for (tab of tabs; track tab.path) {
      <a
        mat-tab-link
        [routerLink]="tab.path"
        routerLinkActive
        #link="routerLinkActive"
        [active]="link.isActive"
      >
        {{ tab.label }}
      </a>
    }
  </nav>
  <mat-tab-nav-panel #panel class="settings__panel">
    <router-outlet />
  </mat-tab-nav-panel>
</section>
